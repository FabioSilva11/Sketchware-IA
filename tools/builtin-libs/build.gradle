// The Java compiler Sketchware runs on the device, used by verify_generated_code.py.
configurations {
    onDeviceJavaCompiler
    // Guava's ListenableFuture interface on its own. Next to full Guava, Gradle resolves the
    // listenablefuture artifact to an empty version, so it's fetched separately.
    listenableFuture { transitive = false }
}

dependencies {
    onDeviceJavaCompiler "org.eclipse.jdt:ecj:3.26.0"
    listenableFuture "com.google.guava:listenablefuture:1.0"
}

tasks.register("exportBuiltInLibraries") {
    def runtimeClasspath = configurations.named("releaseRuntimeClasspath")
    def output = layout.buildDirectory.file("builtin-libs.json")
    outputs.file(output)
    outputs.upToDateWhen { false }

    doLast {
        def configuration = runtimeClasspath.get()
        // The legacy API hands out the raw .aar/.jar files, without AGP's transforms.
        def files = [:]
        configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            if (id instanceof ModuleComponentIdentifier) {
                files["${id.group}:${id.module}:${id.version}".toString()] =
                        [path: artifact.file.absolutePath, type: artifact.extension]
            }
        }

        def key = { ModuleComponentIdentifier id -> "${id.group}:${id.module}:${id.version}".toString() }
        def dependencyKeys = { component ->
            component.dependencies
                    // Constraints (from BOMs and aligned groups) aren't real dependencies.
                    .findAll { it instanceof ResolvedDependencyResult && !it.constraint }
                    .collect { it.selected.id }
                    .findAll { it instanceof ModuleComponentIdentifier }
                    .collect { key(it) }
                    .unique()
        }

        def resolution = configuration.incoming.resolutionResult
        def components = resolution.allComponents
                .findAll { it.id instanceof ModuleComponentIdentifier }
                .collect { component ->
                    def id = component.id as ModuleComponentIdentifier
                    [id          : key(id),
                     group       : id.group,
                     module      : id.module,
                     version     : id.version,
                     dependencies: dependencyKeys(component),
                     artifact    : files[key(id)]]
                }

        output.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [roots              : dependencyKeys(resolution.root),
                 components         : components,
                 onDeviceJavaCompiler: configurations.onDeviceJavaCompiler.files*.absolutePath,
                 listenableFuture    : configurations.listenableFuture.singleFile.absolutePath]))
        println "Wrote ${components.size()} components to ${output.get().asFile}"
    }
}
